<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日の相棒抽選｜あなたのOTPを見つけよう</title>
<meta name="description" content="ポケモンユナイト全100体から、今日使う1体をランダムで決めます。ロール別の抽選もできます。">
<meta property="og:title" content="今日の相棒抽選｜ポケモンユナイト">
<meta property="og:description" content="迷う時間は終わり。全100体から今日の1体をランダムで決めよう。">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0d1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="./css/style.css?v=10e50586">
</head>
<body>
<div class="page">
  <header class="page-header">
    <a class="back-link" href="./index.html">← トップへ</a>
    <h1 class="page-title">今日の相棒抽選</h1>
  </header>
  <p class="page-lead">迷う時間は終わり。今日の1体を決めよう。</p>

  <main id="main">
    <p class="notice" id="status">データを読み込んでいます…</p>

    <div id="randomRoot" hidden>
      <section class="card">
        <h2 class="card-title">抽選の範囲</h2>
        <div class="chip-group" id="modeGroup"></div>
        <p class="small-text" id="modeCount"></p>
      </section>

      <button type="button" class="button button-primary button-jumbo" id="drawButton">
        <span class="button-main">今日の1体を引く</span>
      </button>

      <section class="card result-card" id="drawResult" aria-live="polite" aria-atomic="true" hidden>
        <p class="result-label">今日の相棒は</p>
        <p class="result-pokemon" id="drawPokemon"></p>
        <p class="result-role"><span id="drawRole"></span></p>
        <p class="draw-flavor" id="drawFlavor"></p>
        <div class="share-card">
          <a class="button button-primary" id="shareButton" href="#" target="_blank" rel="noopener">
            <span class="button-main">Xでシェアする</span>
          </a>
          <button type="button" class="button button-ghost" id="redrawButton">
            <span class="button-main">もう一度引く</span>
          </button>
        </div>
      </section>

      <nav class="cta-stack">
        <a class="button button-secondary" href="./diagnosis.html">
          <span class="button-main">OTP診断もやってみる</span>
          <span class="button-sub">約3分・30問で、使い込みたくなる相棒を診断</span>
        </a>
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    <p>このサイトはPokémon UNITEの非公式ファンサイトです。株式会社ポケモン、任天堂、Creatures、Game Freak、TiMi Studio Group等とは一切関係ありません。</p>
    <p>「ポケモン」「Pokémon」「Pokémon UNITE」および各ポケモンの名称は、それぞれの権利者に帰属します。公式のロゴ・画像・ゲーム内素材は使用していません。</p>
  </footer>
</div>
<script type="module" src="./js/random.js?v=639d8337"></script>
</body>
</html>
