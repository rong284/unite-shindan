# main に push されたら、テストを通したうえでサイト部分だけを GitHub Pages に公開する。
# （Excel・テスト・ツールは公開しない）
# 初回のみ: リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: テスト
        run: node tests/run-tests.mjs

      - name: JS・CSSの版番号が最新か確認
        run: python3 tools/stamp_assets.py --check

      - name: 公開するファイルだけを集める
        run: |
          mkdir _site
          cp index.html diagnosis.html result.html random.html .nojekyll _site/
          cp -r css js data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
